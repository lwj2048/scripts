name: '挂载 WebDAV 存储'
description: '使用 davfs2 挂载 WebDAV 存储服务，支持多平台'
inputs:
  platform:
    description: '目标平台 (ubuntu/macos/windows)'
    required: true
    default: 'ubuntu'
  webdav_url:
    description: 'WebDAV 服务 URL'
    required: true
  username:
    description: 'WebDAV 用户名'
    required: true
  password:
    description: 'WebDAV 密码'
    required: true
  mount_point:
    description: '挂载点路径'
    required: false
    default: '/mnt/share'


runs:
  using: 'composite'
  steps:
    - name: 安装 davfs2 (Ubuntu)
      if: ${{ inputs.platform == 'ubuntu' }}
      shell: bash
      env:
        WEBDAV_URL: ${{ inputs.webdav_url }}
        WEBDAV_USERNAME: ${{ inputs.username }}
        WEBDAV_PASSWORD: ${{ inputs.password }}
        MOUNT_POINT: ${{ inputs.mount_point }}
      run: |
        set -euo pipefail

        sudo apt update
        sudo apt install -y davfs2 fuse3 rclone
        sudo mkdir -p "${MOUNT_POINT}"

        printf '%s %s %s\n' "${WEBDAV_URL}" "${WEBDAV_USERNAME}" "${WEBDAV_PASSWORD}" | sudo tee /etc/davfs2/secrets > /dev/null
        sudo chmod 600 /etc/davfs2/secrets

        sudo sed -i '/^use_locks /d' /etc/davfs2/davfs2.conf
        echo "use_locks 0" | sudo tee -a /etc/davfs2/davfs2.conf > /dev/null

        if sudo mount -t davfs "${WEBDAV_URL}" "${MOUNT_POINT}" && ls -la "${MOUNT_POINT}" > /dev/null; then
          echo "WebDAV 已通过 davfs2 挂载到 ${MOUNT_POINT}"
          exit 0
        fi

        echo "davfs2 挂载不可读，切换为 rclone WebDAV 挂载"
        sudo umount "${MOUNT_POINT}" 2>/dev/null || true
        sudo mkdir -p /root/.config/rclone
        RCLONE_OBSCURED_PASS="$(rclone obscure "${WEBDAV_PASSWORD}")"
        {
          echo "[koofr]"
          echo "type = webdav"
          echo "url = ${WEBDAV_URL}"
          echo "vendor = other"
          echo "user = ${WEBDAV_USERNAME}"
          echo "pass = ${RCLONE_OBSCURED_PASS}"
        } | sudo tee /root/.config/rclone/rclone.conf > /dev/null

        sudo sed -i 's/^#user_allow_other/user_allow_other/' /etc/fuse.conf
        if ! grep -q '^user_allow_other' /etc/fuse.conf; then
          echo "user_allow_other" | sudo tee -a /etc/fuse.conf > /dev/null
        fi
        sudo rclone mount koofr: "${MOUNT_POINT}" --config /root/.config/rclone/rclone.conf --allow-other --vfs-cache-mode writes --daemon
        sleep 3
        ls -la "${MOUNT_POINT}" > /dev/null
        echo "WebDAV 已通过 rclone 挂载到 ${MOUNT_POINT}"

    - name: 安装 davfs2 (macOS)
      if: ${{ inputs.platform == 'macos' }}
      shell: bash
      run: |
        echo "暂不支持"

    - name: 安装 davfs2 (Windows)
      if: ${{ inputs.platform == 'windows' }}
      shell: bash
      run: |
        echo "暂不支持"

        

        
