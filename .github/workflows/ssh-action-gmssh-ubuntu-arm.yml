name: GMSSH (linux arm)

on:
  workflow_dispatch:
    inputs:
      keepalive_hours:
        description: "安装完成后保活时长（小时）"
        required: false
        default: "5"
      verify_command:
        description: "可选：安装完成后执行的校验命令"
        required: false
        default: ""

jobs:
  gmssh-linux-arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      SSH_USERNAME: root
      SSH_PORT: "22"
      GMSSH_WEB_PORT: "8080"
      NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN2 }}
      CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.9'

      - name: 检查系统信息
        run: |
          echo "🔹 系统信息："
          uname -a
          lsb_release -a
          df -h
          lscpu | grep Architecture || true

      - name: 扩大空间
        uses: ./.github/actions/expand-space
        with:
          platform: 'ubuntu'

      - name: 安装 SSH 服务
        uses: ./.github/actions/install-ssh
        with:
          platform: 'ubuntu'
          public_key: ${{ secrets.ID_RSA_PUB }}
          username: 'root'

      - name: 校验安装参数
        run: |
          set -euo pipefail
          if [ -z "${NGROK_AUTH_TOKEN:-}" ]; then
            echo "缺少 secret: NGROK_AUTH_TOKEN2"
            echo "需要用 ngrok 暴露 SSH 端口，否则外部无法直接登录此 runner。"
            exit 1
          fi

      - name: 安装 GMSSH 依赖
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates jq

      - name: 安装 GMSSH
        run: |
          set -euo pipefail
          echo "开始下载并安装 GMSSH..."
          curl -fsSL https://gmb-prod-gw.oss-accelerate.aliyuncs.com/package/sh/gm.sh -o gm.sh
          chmod +x gm.sh
          echo "尝试使用端口 ${GMSSH_WEB_PORT} 安装，避免 GitHub runner 对 80 端口的误判..."
          if printf '%s\n' "${GMSSH_WEB_PORT}" | sudo ./gm.sh install; then
            echo "GMSSH 安装完成"
          else
            echo "GMSSH 安装失败。安装脚本默认会检查 80 端口，GitHub-hosted runner 上容易误判。"
            echo "如果此处仍失败，优先改用普通云服务器或 self-hosted runner。"
            exit 1
          fi

      - name: 执行可选校验命令
        if: ${{ inputs.verify_command != '' }}
        run: |
          set -euo pipefail
          bash -lc "${{ inputs.verify_command }}"

      - name: 安装 ngrok 并暴露 SSH 端口
        uses: ./.github/actions/ngrok-ssh
        with:
          platform: 'ubuntu'
          auth_token: ${{ secrets.NGROK_AUTH_TOKEN2 }}
          port: '22'
          protocol: 'tcp'

      - name: 安装 Cloudflared 隧道
        if: ${{ env.CLOUDFLARE_TUNNEL_TOKEN != '' }}
        uses: ./.github/actions/cloudflared-tunnel
        with:
          platform: 'ubuntu'
          tunnel_token: ${{ secrets.CLOUDFLARE_TUNNEL_GITHUB_TOKEN }}
          log_file: 'cloudflared.log'

      - name: 获取访问地址
        run: |
          set -euo pipefail
          sleep 5
          if curl -s http://127.0.0.1:4040/api/tunnels > /dev/null 2>&1; then
            curl -s http://127.0.0.1:4040/api/tunnels | jq -r '.tunnels[0].public_url' > ssh_address.txt
            echo "🔹 ngrok SSH 地址：$(cat ssh_address.txt)"
          else
            echo "未获取到 ngrok 地址"
          fi

          if [ -f "cloudflared.log" ]; then
            echo "🔹 Cloudflared 隧道已启动，最近日志："
            tail -n 5 cloudflared.log || true
          fi

      - name: 输出登录信息
        run: |
          set -euo pipefail
          echo "🔹 GMSSH 安装流程已完成"
          echo "🔹 SSH 用户：${SSH_USERNAME}"
          echo "🔹 SSH 端口：${SSH_PORT}"
          echo "🔹 GMSSH Web 端口：${GMSSH_WEB_PORT}"
          echo "🔹 认证方式：使用与 secrets.ID_RSA_PUB 对应的私钥"
          if [ -f "ssh_address.txt" ]; then
            SSH_HOST=$(sed -E 's#tcp://([^:]+):([0-9]+)#\1#' ssh_address.txt)
            SSH_REMOTE_PORT=$(sed -E 's#tcp://([^:]+):([0-9]+)#\2#' ssh_address.txt)
            echo "🔹 SSH 登录命令：ssh ${SSH_USERNAME}@${SSH_HOST} -p ${SSH_REMOTE_PORT}"
            echo "🔹 在 GMSSH 中新增服务器时填写："
            echo "   - 主机：${SSH_HOST}"
            echo "   - 端口：${SSH_REMOTE_PORT}"
            echo "   - 用户名：${SSH_USERNAME}"
            echo "   - 认证：导入对应私钥"
          else
            echo "未生成 ngrok 地址，无法输出 SSH 登录命令"
          fi
          echo "🔹 说明：GitHub-hosted runner 是临时机器，任务结束后环境会销毁"

      - name: 保持 runner 在线
        run: |
          set -euo pipefail
          hours="${{ inputs.keepalive_hours }}"
          if ! [[ "$hours" =~ ^[0-9]+$ ]]; then
            echo "keepalive_hours 必须是整数"
            exit 1
          fi
          echo "保持 runner 在线 ${hours} 小时，便于临时连接和验证"
          sleep "${hours}h"
