name: GMSSH (linux arm)

on:
  workflow_dispatch:
    inputs:
      keepalive_hours:
        description: "安装完成后保活时长（小时）"
        required: false
        default: "5"
      verify_command:
        description: "可选：安装完成后执行的校验命令"
        required: false
        default: ""

jobs:
  gmssh-linux-arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      SSH_USERNAME: "root"
      SSH_PORT: "22"
      GMSSH_WEB_PORT: "8080"
      NGROK_SSH_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
      NGROK_WEB_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN2 }}
      CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.9'

      - name: 检查系统信息
        run: |
          echo "🔹 系统信息："
          uname -a
          lsb_release -a
          df -h
          lscpu | grep Architecture || true

      - name: 扩大空间
        uses: ./.github/actions/expand-space
        with:
          platform: 'ubuntu'

      - name: 安装 SSH 服务
        uses: ./.github/actions/install-ssh
        with:
          platform: 'ubuntu'
          public_key: ${{ secrets.ID_RSA_PUB }}
          username: 'root'

      - name: 校验安装参数
        run: |
          set -euo pipefail
          if [ -z "${NGROK_SSH_AUTH_TOKEN:-}" ]; then
            echo "缺少 secret: NGROK_AUTH_TOKEN"
            echo "需要用 ngrok 暴露 SSH 端口。"
            exit 1
          fi
          if [ -z "${NGROK_WEB_AUTH_TOKEN:-}" ]; then
            echo "缺少 secret: NGROK_AUTH_TOKEN2"
            echo "需要用 ngrok 暴露 GMSSH Web 端口。"
            exit 1
          fi

      - name: 安装 GMSSH 依赖
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates jq

      - name: 安装 GMSSH
        run: |
          set -euo pipefail
          echo "开始下载并安装 GMSSH..."
          curl -fsSL https://gmb-prod-gw.oss-accelerate.aliyuncs.com/package/sh/gm.sh -o gm.sh
          chmod +x gm.sh
          echo "安装脚本会默认检查 80 端口；在 GitHub runner 上这里通常会误判。"
          set +e
          sudo ./gm.sh install
          install_exit_code=$?
          set -e
          echo "安装脚本退出码: ${install_exit_code}"

      - name: 改 GMSSH 端口并启动服务
        run: |
          set -euo pipefail
          if ! command -v gm >/dev/null 2>&1; then
            echo "未找到 gm 命令，说明安装没有完成到可修复阶段"
            exit 1
          fi

          echo "将 GMSSH 端口改为 ${GMSSH_WEB_PORT}"
          sudo gm setport "${GMSSH_WEB_PORT}"

          echo "尝试启动 GMServer 服务"
          sudo systemctl daemon-reload || true
          sudo systemctl enable GMServer || true
          sudo systemctl restart GMServer || sudo systemctl start GMServer
          sleep 3

      - name: 校验 GMSSH 服务状态
        run: |
          set -euo pipefail
          sudo systemctl status GMServer --no-pager || true
          ss -ltnp | grep ":${GMSSH_WEB_PORT} " || {
            echo "GMSSH 没有监听在 ${GMSSH_WEB_PORT}"
            exit 1
          }

      - name: 执行可选校验命令
        if: ${{ inputs.verify_command != '' }}
        run: |
          set -euo pipefail
          bash -lc "${{ inputs.verify_command }}"

      - name: 安装 ngrok
        run: |
          set -euo pipefail
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt-get update
          sudo apt-get install -y ngrok

      - name: 启动 SSH ngrok
        run: |
          set -euo pipefail
          mkdir -p /tmp/ngrok-ssh
          cat > /tmp/ngrok-ssh/ngrok.yml <<EOF
          version: 2
          authtoken: ${NGROK_SSH_AUTH_TOKEN}
          EOF
          export NGROK_CONFIG=/tmp/ngrok-ssh/ngrok.yml
          nohup ngrok tcp "${SSH_PORT}" > /tmp/gmssh-ngrok-ssh.log 2>&1 &
          sleep 5

      - name: 获取 SSH 地址
        run: |
          set -euo pipefail
          if curl -s http://127.0.0.1:4040/api/tunnels > /dev/null 2>&1; then
            curl -s http://127.0.0.1:4040/api/tunnels | jq -r '.tunnels[] | select(.proto == "tcp") | .public_url' | head -n 1 > ssh_address.txt
            if [ -s ssh_address.txt ]; then
              echo "🔹 SSH 地址：$(cat ssh_address.txt)"
            else
              echo "未生成 SSH 地址"
              exit 1
            fi
          else
            echo "未获取到 SSH ngrok 地址"
            exit 1
          fi

          if [ -f "/tmp/gmssh-ngrok-ssh.log" ]; then
            echo "🔹 ngrok SSH 最近日志："
            tail -n 20 /tmp/gmssh-ngrok-ssh.log || true
          fi

      - name: 启动 GMSSH Web ngrok
        run: |
          set -euo pipefail
          mkdir -p /tmp/ngrok-web
          cat > /tmp/ngrok-web/ngrok.yml <<EOF
          version: 2
          authtoken: ${NGROK_WEB_AUTH_TOKEN}
          EOF
          export NGROK_CONFIG=/tmp/ngrok-web/ngrok.yml
          nohup ngrok http "https://127.0.0.1:${GMSSH_WEB_PORT}" > /tmp/gmssh-ngrok.log 2>&1 &
          sleep 5

      - name: 安装 Cloudflared 隧道
        if: ${{ env.CLOUDFLARE_TUNNEL_TOKEN != '' }}
        uses: ./.github/actions/cloudflared-tunnel
        with:
          platform: 'ubuntu'
          tunnel_token: ${{ secrets.CLOUDFLARE_TUNNEL_GITHUB_TOKEN }}
          log_file: 'cloudflared.log'

      - name: 获取访问地址
        run: |
          set -euo pipefail
          sleep 5
          if curl -s http://127.0.0.1:4040/api/tunnels > /dev/null 2>&1; then
            curl -s http://127.0.0.1:4040/api/tunnels | jq -r '.tunnels[] | select(.proto == "https" or .proto == "http") | .public_url' | head -n 1 > gmssh_web_url.txt
            if [ -s gmssh_web_url.txt ]; then
              echo "🔹 你的地址：$(cat gmssh_web_url.txt)"
            fi
          else
            echo "未获取到 ngrok 地址"
          fi

          if [ -f "/tmp/gmssh-ngrok.log" ]; then
            echo "🔹 ngrok 最近日志："
            tail -n 20 /tmp/gmssh-ngrok.log || true
          fi

          if [ -f "cloudflared.log" ]; then
            echo "🔹 Cloudflared 隧道已启动，最近日志："
            tail -n 5 cloudflared.log || true
          fi

      - name: 输出登录信息
        run: |
          set -euo pipefail
          echo "🔹 GMSSH 安装流程已完成"
          echo "🔹 SSH 用户：${SSH_USERNAME}"
          echo "🔹 SSH 端口：${SSH_PORT}"
          echo "🔹 GMSSH Web 端口：${GMSSH_WEB_PORT}"
          if [ -f "ssh_address.txt" ]; then
            SSH_HOST=$(sed -E 's#tcp://([^:]+):([0-9]+)#\1#' ssh_address.txt)
            SSH_REMOTE_PORT=$(sed -E 's#tcp://([^:]+):([0-9]+)#\2#' ssh_address.txt)
            echo "🔹 SSH 登录命令：ssh ${SSH_USERNAME}@${SSH_HOST} -p ${SSH_REMOTE_PORT}"
            echo "🔹 在 GMSSH 登录页中填写："
            echo "   - host地址：${SSH_HOST}"
            echo "   - 端口：${SSH_REMOTE_PORT}"
            echo "   - 用户名：${SSH_USERNAME}"
            echo "   - 证书：上传与 secrets.ID_RSA_PUB 对应的私钥"
          else
            echo "未生成 SSH 地址"
          fi
          if [ -f "gmssh_web_url.txt" ]; then
            echo "🔹 GMSSH Web 访问地址：$(cat gmssh_web_url.txt)"
            echo "🔹 直接用本地浏览器打开上面的 https 地址"
          else
            echo "未生成 GMSSH Web 地址"
          fi
          echo "🔹 说明：GitHub-hosted runner 是临时机器，任务结束后环境会销毁"

      - name: 保持 runner 在线
        run: |
          set -euo pipefail
          hours="${{ inputs.keepalive_hours }}"
          if ! [[ "$hours" =~ ^[0-9]+$ ]]; then
            echo "keepalive_hours 必须是整数"
            exit 1
          fi
          echo "保持 runner 在线 ${hours} 小时，便于临时连接和验证"
          sleep "${hours}h"
