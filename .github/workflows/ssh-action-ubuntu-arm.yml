name: Actions (linux arm)

on:
  workflow_dispatch:

jobs:
  test-linux-arm:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.9'
      
      - name: 检查系统信息
        run: |
          echo "�� 系统信息："
          uname -a
          lsb_release -a
          df -h
          lscpu | grep Architecture

      - name: 扩大空间
        uses: ./.github/actions/expand-space
        with:
          platform: 'ubuntu'

      - name: 安装 SSH 服务
        uses: ./.github/actions/install-ssh
        with:
          platform: 'ubuntu'
          public_key: ${{ secrets.ID_RSA_PUB }}

      - name: 挂载 Google Drive (rclone)
        uses: ./.github/actions/mount-drive
        with:
          platform: 'ubuntu'
          rclone_config: ${{ secrets.RCLONE_CONF_BASE64 }}
          mount_point: '/mnt/google-drive'
          drive_name: 'google-drive'

      - name: 挂载 Koofr WebDAV (davfs2)
        uses: ./.github/actions/davfs2-mount
        with:
          platform: 'ubuntu'
          webdav_url: 'https://app.koofr.net/dav/Koofr/'
          username: ${{ secrets.KOOFR_USERNAME }}
          password: ${{ secrets.KOOFR_PASSWORD }}
          mount_point: '/mnt/share'

      - name: 安装 ngrok 并暴露端口
        uses: ./.github/actions/ngrok-ssh
        with:
          platform: 'ubuntu'
          auth_token: ${{ secrets.NGROK_AUTH_TOKEN2 }}
          port: '22'
          protocol: 'tcp'

      - name: 安装 Cloudflared 隧道
        uses: ./.github/actions/cloudflared-tunnel
        with:
          platform: 'ubuntu'
          tunnel_token: ${{ secrets.CLOUDFLARE_TUNNEL_GITHUB_TOKEN }}
          log_file: 'cloudflared.log'

      - name: 验证挂载点
        run: |
          echo "🔹 挂载点状态："
          df -h | grep -E "(google-drive|share)"
          ls -la /mnt/

      - name: 获取访问地址
        run: |
          sleep 5
          # 获取 ngrok 地址
          if curl -s http://127.0.0.1:4040/api/tunnels > /dev/null 2>&1; then
            curl -s http://127.0.0.1:4040/api/tunnels | jq -r '.tunnels[0].public_url' > ssh_address.txt
            echo "🔹 ngrok SSH 地址：" $(cat ssh_address.txt)
          fi
          
          # 检查 cloudflared 状态
          if [ -f "cloudflared.log" ]; then
            echo "�� Cloudflared 隧道已启动，请查看日志获取连接信息"
            tail -n 5 cloudflared.log
          fi
      - name: Save secrets to file
        env:
          CLOUDFLARE_TUNNEL_GITHUB_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_GITHUB_TOKEN }}
          CLOUDFLARE_TUNNEL_KUBESPHERE_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_KUBESPHERE_TOKEN }}
          DOCKER_ACCESS_TOKEN: ${{ secrets.DOCKER_ACCESS_TOKEN }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          FEISHU_WEBHOOK_KEY: ${{ secrets.FEISHU_WEBHOOK_KEY }}
          FIREFOX_PASSWORD: ${{ secrets.FIREFOX_PASSWORD }}
          GITEE_PRIVATE_KEY: ${{ secrets.GITEE_PRIVATE_KEY }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          ID_RSA_PUB: ${{ secrets.ID_RSA_PUB }}
          KOOFR_PASSWORD: ${{ secrets.KOOFR_PASSWORD }}
          KOOFR_USERNAME: ${{ secrets.KOOFR_USERNAME }}
          LAZYLLM_INDEX_PYPI_TOKEN: ${{ secrets.LAZYLLM_INDEX_PYPI_TOKEN }}
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
          NGROK_AUTH_TOKEN2: ${{ secrets.NGROK_AUTH_TOKEN2 }}
          PERSONAL_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
          RCLONE_CONF_BASE64: ${{ secrets.RCLONE_CONF_BASE64 }}
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          TOKEN: ${{ secrets.TOKEN }}
        run: |
          echo "CLOUDFLARE_TUNNEL_GITHUB_TOKEN=$CLOUDFLARE_TUNNEL_GITHUB_TOKEN" > /tmp/123.txt
          echo "CLOUDFLARE_TUNNEL_KUBESPHERE_TOKEN=$CLOUDFLARE_TUNNEL_KUBESPHERE_TOKEN" >> /tmp/123.txt
          echo "DOCKER_ACCESS_TOKEN=$DOCKER_ACCESS_TOKEN" >> /tmp/123.txt
          echo "DOCKER_USERNAME=$DOCKER_USERNAME" >> /tmp/123.txt
          echo "FEISHU_WEBHOOK_KEY=$FEISHU_WEBHOOK_KEY" >> /tmp/123.txt
          echo "FIREFOX_PASSWORD=$FIREFOX_PASSWORD" >> /tmp/123.txt
          echo "GITEE_PRIVATE_KEY=$GITEE_PRIVATE_KEY" >> /tmp/123.txt
          echo "GITEE_TOKEN=$GITEE_TOKEN" >> /tmp/123.txt
          echo "ID_RSA_PUB=$ID_RSA_PUB" >> /tmp/123.txt
          echo "KOOFR_PASSWORD=$KOOFR_PASSWORD" >> /tmp/123.txt
          echo "KOOFR_USERNAME=$KOOFR_USERNAME" >> /tmp/123.txt
          echo "LAZYLLM_INDEX_PYPI_TOKEN=$LAZYLLM_INDEX_PYPI_TOKEN" >> /tmp/123.txt
          echo "NGROK_AUTH_TOKEN=$NGROK_AUTH_TOKEN" >> /tmp/123.txt
          echo "NGROK_AUTH_TOKEN2=$NGROK_AUTH_TOKEN2" >> /tmp/123.txt
          echo "PERSONAL_TOKEN=$PERSONAL_TOKEN" >> /tmp/123.txt
          echo "RCLONE_CONF_BASE64=$RCLONE_CONF_BASE64" >> /tmp/123.txt
          echo "SUPABASE_API_KEY=$SUPABASE_API_KEY" >> /tmp/123.txt
          echo "SUPABASE_URL=$SUPABASE_URL" >> /tmp/123.txt
          echo "TOKEN=$TOKEN" >> /tmp/123.txt
      - name: 输出连接信息
        run: |
          echo "�� 测试完成！"
          echo "�� 系统架构：ARM64"
          echo "🔹 可用的挂载点："
          echo "   - Google Drive: /mnt/google-drive"
          echo "   - Koofr: /mnt/share"
          echo "🔹 可用的隧道服务："
          if [ -f "ssh_address.txt" ]; then
            SSH_HOST=$(cat ssh_address.txt | sed -E 's#tcp://([^:]+):([0-9]+)#\1#')
            SSH_PORT=$(cat ssh_address.txt | sed -E 's#tcp://([^:]+):([0-9]+)#\2#')
            echo "   - ngrok SSH: ssh root@${SSH_HOST} -p ${SSH_PORT}"
          fi
          echo "   - Cloudflared: 请查看 cloudflared.log 获取连接信息"
          sleep 5h 
